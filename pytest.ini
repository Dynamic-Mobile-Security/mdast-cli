[pytest]
testpaths = tests
markers =
    unit: fast isolated tests of a single module
    contract: tests pinning the HTTP contract with the Clark facade / monolith
    smoke: end-to-end CLI flows against a mocked server
    e2e: negative end-to-end CLI flows asserting exit codes
    security: security-focused checks (secrets handling, header trust, TLS)
filterwarnings =
    ignore::DeprecationWarning
